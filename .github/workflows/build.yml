name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Signed with the fixed key in app/blacksand-debug.keystore, so every build installs
      # over the last one and keeps playlists and resume state.
      - name: Build debug APK
        run: |
          gradle assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "BlackSand-${{ github.run_number }}.apk"

      # Also attach the APK to the run itself (Summary page → Artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: BlackSand-${{ github.run_number }}
          path: BlackSand-${{ github.run_number }}.apk

      # Full releases (not pre-releases) so Obtainium picks them up, tagged with the
      # version the APK reports (0.1.N) so it can tell what's newer.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Black Sand 0.1.${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: BlackSand-${{ github.run_number }}.apk
